<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgGrad_8" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <linearGradient id="borderGrad_8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow_8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 300x300 Card -->
  <rect x="8" y="8" width="284" height="284" rx="30" fill="url(#bgGrad_8)" stroke="url(#borderGrad_8)" stroke-width="4.5" />
  
  <!-- Magic Decorative Concentric Rings -->
  <circle cx="150" cy="125" r="82" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="8,5" opacity="0.45" />
  <circle cx="150" cy="125" r="72" fill="none" stroke="#eab308" stroke-width="2" opacity="0.65" />

  <!-- Glowing Emblem Aura -->
  <circle cx="150" cy="125" r="62" fill="#eab308" opacity="0.25" filter="url(#glow_8)" />

  <!-- Animal Character Icon (Center) -->
  <text x="150" y="156" font-size="82" text-anchor="middle" filter="url(#glow_8)">🦁</text>

  <!-- Elemental Badge (Top) -->
  <rect x="85" y="22" width="130" height="26" rx="13" fill="#eab308" opacity="0.9" />
  <text x="150" y="40" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">LIGHT</text>

  <!-- Name Plaque (Bottom) -->
  <rect x="22" y="224" width="256" height="50" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="#fef08a" stroke-width="1.5" />
  <text x="150" y="247" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Solar Lion</text>
  <text x="150" y="265" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fef08a" text-anchor="middle">เจ้าราชสีห์สุริยัน</text>
</svg>