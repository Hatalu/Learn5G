<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgGrad_6" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
    <linearGradient id="borderGrad_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow_6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 300x300 Card -->
  <rect x="8" y="8" width="284" height="284" rx="30" fill="url(#bgGrad_6)" stroke="url(#borderGrad_6)" stroke-width="4.5" />
  
  <!-- Magic Decorative Concentric Rings -->
  <circle cx="150" cy="125" r="82" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,5" opacity="0.45" />
  <circle cx="150" cy="125" r="72" fill="none" stroke="#d97706" stroke-width="2" opacity="0.65" />

  <!-- Glowing Emblem Aura -->
  <circle cx="150" cy="125" r="62" fill="#d97706" opacity="0.25" filter="url(#glow_6)" />

  <!-- Animal Character Icon (Center) -->
  <text x="150" y="156" font-size="82" text-anchor="middle" filter="url(#glow_6)">🐻</text>

  <!-- Elemental Badge (Top) -->
  <rect x="85" y="22" width="130" height="26" rx="13" fill="#d97706" opacity="0.9" />
  <text x="150" y="40" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">THUNDER</text>

  <!-- Name Plaque (Bottom) -->
  <rect x="22" y="224" width="256" height="50" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="#fbbf24" stroke-width="1.5" />
  <text x="150" y="247" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Thunder Bear</text>
  <text x="150" y="265" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">พญาหมีเกราะสายฟ้า</text>
</svg>