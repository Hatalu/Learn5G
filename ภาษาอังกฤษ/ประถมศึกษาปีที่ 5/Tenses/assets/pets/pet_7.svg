<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bgGrad_7" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>
    <linearGradient id="borderGrad_7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow_7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 300x300 Card -->
  <rect x="8" y="8" width="284" height="284" rx="30" fill="url(#bgGrad_7)" stroke="url(#borderGrad_7)" stroke-width="4.5" />
  
  <!-- Magic Decorative Concentric Rings -->
  <circle cx="150" cy="125" r="82" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8,5" opacity="0.45" />
  <circle cx="150" cy="125" r="72" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.65" />

  <!-- Glowing Emblem Aura -->
  <circle cx="150" cy="125" r="62" fill="#2563eb" opacity="0.25" filter="url(#glow_7)" />

  <!-- Animal Character Icon (Center) -->
  <text x="150" y="156" font-size="82" text-anchor="middle" filter="url(#glow_7)">🦊</text>

  <!-- Elemental Badge (Top) -->
  <rect x="85" y="22" width="130" height="26" rx="13" fill="#2563eb" opacity="0.9" />
  <text x="150" y="40" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">COSMIC</text>

  <!-- Name Plaque (Bottom) -->
  <rect x="22" y="224" width="256" height="50" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="#60a5fa" stroke-width="1.5" />
  <text x="150" y="247" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">Astral Fox</text>
  <text x="150" y="265" font-family="'Segoe UI', sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">จิ้งจอกเก้าหางแสงดาว</text>
</svg>